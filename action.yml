name: Codex plan runner
description: Execute an authorized plan in full-access/YOLO mode on Linux and export verified checkpoints
inputs:
  action-source-sha:
    description: Exact approved action implementation commit, verified by the trusted caller
    required: true
  task-id:
    description: Stable task ID; generated when omitted for a new task
  resume-artifact-id:
    description: Explicit schema-2 checkpoint artifact; mutually exclusive with plan and issue-url
  auto-continue:
    description: Enable trusted-controller continuation after budget stops
    default: 'true'
  max-continuations:
    description: Maximum additional runs, frozen across the task chain
    default: '3'
  continuation-context:
    description: Verified execution settings passed by the trusted task workflow
  parent-job-ended-at:
    description: Native completed_at of the parent execution job, verified before resume
  parent-job-name:
    description: Verified parent job name when timeout precedes execution
  review-budget:
    description: Verified remaining per-head review allowance passed by the trusted workflow
  working-directory:
    description: Checked-out target directory relative to GITHUB_WORKSPACE
    default: .
  plan:
    description: Inline approved plan; mutually exclusive with issue-url
  issue-url:
    description: GitHub issue URL in the checked-out repository; mutually exclusive with plan
  authorization:
    description: JSON with repository, plan_sha256, and the direct delivery request
    required: true
  codex-config:
    description: Secret-backed Codex config.toml contents
    required: true
  codex-api-key:
    description: Secret API credential for Codex
    required: true
  github-token:
    description: Secret publication credential; never persisted in Git configuration
    required: true
  git-author-name:
    description: Explicit author and committer name for this job
    required: true
  git-author-email:
    description: Explicit author and committer email for this job
    required: true
  skills:
    description: JSON array of additional repository, revision (full SHA), and names skill sources
    default: '[]'
  budget-minutes:
    description: Total runtime budget, including a 120-second shutdown and export reserve
    default: '300'
outputs:
  task-id:
    description: Unique task identifier
  branch:
    description: Published task branch
  base-sha:
    description: Verified task base
  checkpoint-sha:
    description: Last successfully uploaded checkpoint's pushed commit
  session-id:
    description: Explicit worker conversation identifier
  artifact-id:
    description: Last durable checkpoint artifact ID
  pull-request-url:
    description: Delivered or in-progress pull request
  status:
    description: completed, continuing, cancelled, incomplete, blocked, or failed
  root-run-id:
    description: Original task workflow run
  parent-run-id:
    description: Previous run in the continuation chain
  continuation-count:
    description: Number of additional runs consumed
runs:
  using: node24
  main: dist/index.js
