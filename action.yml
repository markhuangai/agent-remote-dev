name: Codex skill runner
description: Run native Codex with selected skills on Linux and transport verified session checkpoints
inputs:
  working-directory:
    description: Target checkout relative to GITHUB_WORKSPACE
    default: .
  plan:
    description: Prompt passed verbatim to Codex, including any issue references; continuation restores the frozen prompt
  resume-run-id:
    description: Prior workflow run whose latest saved Codex session and pushed source revision should be restored
  codex-config:
    description: Secret-backed Codex TOML configuration
    required: true
  codex-api-key:
    description: Secret model credential
    required: true
  github-token:
    description: Secret task credential; never persisted in Git configuration
    required: true
outputs:
  branch:
    description: Skill-chosen branch observed at the last durable checkpoint, empty for detached HEAD
  base-sha:
    description: Initial source revision
  checkpoint-sha:
    description: Last verified remote source revision
  session-id:
    description: Native Codex conversation identity
  artifact-id:
    description: Last durable checkpoint artifact
  result-artifact-id:
    description: Protected opaque native response artifact
  native-outcome:
    description: Native invocation outcome; no interpretation of skill success
  status:
    description: completed, continuing, cancelled, incomplete, or failed infrastructure outcome
  root-run-id:
    description: Initial task workflow run
  parent-run-id:
    description: Prior run in the continuation chain
  continuation-count:
    description: Additional runs consumed
runs:
  using: node24
  main: dist/index.js
