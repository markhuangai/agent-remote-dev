name: Reusable remote Codex

on:
  workflow_call:
    inputs:
      plan:
        description: Refined plan for a new task, or additional context for a resumed conversation
        type: string
        default: ''
      resume-run-id:
        description: Prior run containing the native session to resume
        type: string
        default: ''
      runs-on:
        description: JSON array of consumer-selected Linux runner labels
        type: string
        default: '["ubuntu-latest"]'
      timeout-minutes:
        description: GitHub job timeout, subject to the selected runner's limits
        type: number
        default: 360
    secrets:
      codex-config:
        required: true
      codex-api-key:
        required: true
      github-token:
        required: true

permissions:
  contents: read
  actions: write

env:
  TRIGGERING_ACTOR: ${{ github.triggering_actor }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      provider_sha: ${{ steps.source.outputs.sha }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      root_run_id: ${{ steps.prepare.outputs.root_run_id }}
    steps:
      - name: Resolve the reusable workflow's immutable provider source
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          retries: 0
          script: |
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: context.runId });
            const prefix = 'markhuangai/agent-remote-dev-codex/.github/workflows/remote-codex.yml@';
            const references = (run.referenced_workflows || []).filter(item => item.path?.startsWith(prefix));
            if (run.id !== context.runId || run.run_attempt !== Number(process.env.GITHUB_RUN_ATTEMPT) ||
                run.repository?.full_name !== `${context.repo.owner}/${context.repo.repo}` || run.event !== 'workflow_dispatch' ||
                run.head_sha !== process.env.GITHUB_WORKFLOW_SHA || references.length !== 1 || !/^[a-f0-9]{40}$/.test(references[0].sha)) {
              throw new Error('provider_workflow_identity_unavailable');
            }
            core.setOutput('sha', references[0].sha);
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: markhuangai/agent-remote-dev-codex
          ref: ${{ steps.source.outputs.sha }}
          path: provider
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install locked provider dependencies
        working-directory: provider
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Authorize and resolve the conversation
        id: prepare
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CODEX_PLAN: ${{ inputs.plan }}
          CODEX_RESUME_RUN_ID: ${{ inputs.resume-run-id }}
        with:
          retries: 0
          script: |
            const { pathToFileURL } = require('node:url');
            const { workflowCommand } = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/provider/src/platform/control.mjs').href);
            await workflowCommand('prepare', { github, core });

  execute:
    name: Codex execution
    needs: resolve
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    concurrency:
      group: codex-session-${{ github.repository_id }}-${{ needs.resolve.outputs.root_run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: markhuangai/agent-remote-dev-codex
          ref: ${{ needs.resolve.outputs.provider_sha }}
          path: provider
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install and compile locked provider source
        working-directory: provider
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Checkout the consumer repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: Execute Codex
        id: native
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CODEX_PLAN: ${{ inputs.plan }}
          CODEX_RESUME_RUN_ID: ${{ inputs.resume-run-id }}
          CODEX_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
          CODEX_PLATFORM_TOKEN: ${{ github.token }}
          CODEX_PROVIDER_SHA: ${{ needs.resolve.outputs.provider_sha }}
          CODEX_CONFIG_TOML: ${{ secrets.codex-config }}
          CODEX_API_KEY: ${{ secrets.codex-api-key }}
          CODEX_GITHUB_TOKEN: ${{ secrets.github-token }}
        with:
          retries: 0
          script: |
            const { pathToFileURL } = require('node:url');
            const { main } = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/provider/.build/main.js').href);
            await main({ github });
      - name: Save final session
        if: always() && steps.native.outputs.state-path != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CODEX_STATE_PATH: ${{ steps.native.outputs.state-path }}
        with:
          retries: 0
          script: |
            const { pathToFileURL } = require('node:url');
            const { finish } = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/provider/.build/main.js').href);
            await finish({ github, statePath: process.env.CODEX_STATE_PATH });

  recover:
    needs: [resolve, execute]
    if: always() && !cancelled() && needs.resolve.result == 'success' && needs.execute.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: markhuangai/agent-remote-dev-codex
          ref: ${{ needs.resolve.outputs.provider_sha }}
          path: provider
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install locked recovery dependencies
        working-directory: provider
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Continue after timeout
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CODEX_RUNS_ON: ${{ inputs.runs-on }}
          CODEX_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        with:
          retries: 0
          script: |
            const { pathToFileURL } = require('node:url');
            const { workflowCommand } = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/provider/src/platform/control.mjs').href);
            await workflowCommand('recover', { github, core });
