name: Codex continuation controller

on:
  workflow_run:
    workflows: [Codex task runner, Linux runner acceptance]
    types: [completed]

permissions:
  contents: read
  actions: read

env:
  CODEX_RUNNER_PROTOCOL: '2'

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      eligible: ${{ steps.resolve.outputs.eligible }}
      task_id: ${{ steps.resolve.outputs.task_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CONTINUATION_MODE: resolve
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { runController } = await import(pathToFileURL(
              process.env.GITHUB_WORKSPACE + '/.github/scripts/continuation-policy.mjs').href);
            const result = await runController({ github, context, core });
            for (const [name, value] of Object.entries(result)) core.setOutput(name, value);

  dispatch:
    needs: resolve
    if: needs.resolve.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    concurrency:
      group: codex-dispatch-${{ github.repository_id }}-${{ needs.resolve.outputs.task_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Revalidate parent and prepare an immutable claim
        id: prepare
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CONTINUATION_MODE: prepare
        with:
          retries: 0
          script: |
            const { pathToFileURL } = require('node:url');
            const { runController } = await import(pathToFileURL(
              process.env.GITHUB_WORKSPACE + '/.github/scripts/continuation-policy.mjs').href);
            const result = await runController({ github, context, core });
            for (const [name, value] of Object.entries(result)) core.setOutput(name, value);
      - name: Persist dispatch claim before requesting a child
        id: claim
        if: steps.prepare.outputs.upload == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.prepare.outputs.claim_name }}
          path: ${{ steps.prepare.outputs.claim_path }}
          if-no-files-found: error
          overwrite: false
      - name: Dispatch once or reconcile the existing claim
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: steps.prepare.outputs.eligible == 'true'
        env:
          CONTINUATION_MODE: dispatch
          CLAIM_ARTIFACT_ID: ${{ steps.claim.outputs.artifact-id || steps.prepare.outputs.existing_claim_id }}
          NEW_CLAIM: ${{ steps.prepare.outputs.upload }}
        with:
          retries: 0
          script: |
            const { pathToFileURL } = require('node:url');
            const { runController } = await import(pathToFileURL(
              process.env.GITHUB_WORKSPACE + '/.github/scripts/continuation-policy.mjs').href);
            await runController({ github, context, core });
