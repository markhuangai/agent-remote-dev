name: Reusable remote development

on:
  workflow_call:
    inputs:
      runner:
        description: Agent runner (codex or claude)
        type: string
        default: codex
      plan:
        description: Refined plan for a new task, or additional context for a resumed conversation
        type: string
        default: ''
      resume-run-id:
        description: Prior run containing the native session to resume
        type: string
        default: ''
      runs-on:
        description: JSON array of consumer-selected Linux runner labels
        type: string
        default: '["ubuntu-latest"]'
      timeout-minutes:
        description: GitHub job timeout, subject to the selected runner's limits
        type: number
        default: 360
    secrets:
      codex-config:
        required: false
      codex-api-key:
        required: false
      claude-settings:
        required: false
      claude-api-key:
        required: false
      mcp-config:
        required: false
      github-token:
        required: true

permissions:
  contents: read
  actions: write

env:
  TRIGGERING_ACTOR: ${{ github.triggering_actor }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      provider_sha: ${{ steps.source.outputs.sha }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      root_run_id: ${{ steps.prepare.outputs.root_run_id }}
    steps:
      - name: Resolve the reusable workflow's immutable provider source
        id: source
        uses: actions/github-script@v9
        env:
          REMOTE_DEV_JOB_CONTEXT: ${{ toJSON(job) }}
        with:
          retries: 0
          script: |
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: context.runId });
            const job = JSON.parse(process.env.REMOTE_DEV_JOB_CONTEXT);
            const prefix = 'markhuangai/agent-remote-dev/.github/workflows/remote-dev.yml@';
            if (run.id !== context.runId || run.run_attempt !== Number(process.env.GITHUB_RUN_ATTEMPT) ||
                run.repository?.full_name !== `${context.repo.owner}/${context.repo.repo}` || run.event !== 'workflow_dispatch' ||
                run.head_sha !== process.env.GITHUB_WORKFLOW_SHA ||
                job.workflow_repository !== 'markhuangai/agent-remote-dev' ||
                job.workflow_file_path !== '.github/workflows/remote-dev.yml' ||
                typeof job.workflow_ref !== 'string' || !job.workflow_ref.startsWith(prefix) ||
                !/^\S+$/.test(job.workflow_ref.slice(prefix.length)) || !/^[a-f0-9]{40}$/.test(job.workflow_sha)) {
              throw new Error('provider_workflow_identity_unavailable');
            }
            core.setOutput('sha', job.workflow_sha);
      - uses: actions/checkout@v7
        with:
          repository: markhuangai/agent-remote-dev
          ref: ${{ steps.source.outputs.sha }}
          path: provider
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install locked provider dependencies
        working-directory: provider
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Authorize and resolve the conversation
        id: prepare
        uses: actions/github-script@v9
        env:
          REMOTE_DEV_RUNNER: ${{ inputs.runner }}
          REMOTE_DEV_PLAN: ${{ inputs.plan }}
          REMOTE_DEV_RESUME_RUN_ID: ${{ inputs.resume-run-id }}
        with:
          retries: 0
          script: |
            const { pathToFileURL } = require('node:url');
            const { workflowCommand } = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/provider/src/platform/control.mjs').href);
            await workflowCommand('prepare', { github, core });

  execute:
    name: Agent execution
    needs: resolve
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    concurrency:
      group: remote-dev-session-${{ github.repository_id }}-${{ needs.resolve.outputs.root_run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          repository: markhuangai/agent-remote-dev
          ref: ${{ needs.resolve.outputs.provider_sha }}
          path: provider
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install and compile locked provider source
        working-directory: provider
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Checkout the consumer repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: Execute agent
        id: native
        uses: actions/github-script@v9
        env:
          REMOTE_DEV_RUNNER: ${{ inputs.runner }}
          REMOTE_DEV_PLAN: ${{ inputs.plan }}
          REMOTE_DEV_RESUME_RUN_ID: ${{ inputs.resume-run-id }}
          REMOTE_DEV_PLATFORM_TOKEN: ${{ github.token }}
          REMOTE_DEV_PROVIDER_SHA: ${{ needs.resolve.outputs.provider_sha }}
          CODEX_CONFIG_TOML: ${{ inputs.runner == 'codex' && secrets.codex-config || '' }}
          CODEX_API_KEY: ${{ inputs.runner == 'codex' && secrets.codex-api-key || '' }}
          CLAUDE_SETTINGS_JSON: ${{ inputs.runner == 'claude' && secrets.claude-settings || '' }}
          ANTHROPIC_API_KEY: ${{ inputs.runner == 'claude' && secrets.claude-api-key || '' }}
          MCP_CONFIG_JSON: ${{ secrets.mcp-config }}
          REMOTE_DEV_GITHUB_TOKEN: ${{ secrets.github-token }}
        with:
          retries: 0
          script: |
            const { pathToFileURL } = require('node:url');
            const { main } = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/provider/.build/main.js').href);
            await main({ github });
      - name: Save final session
        if: always() && steps.native.outputs.state-path != ''
        uses: actions/github-script@v9
        env:
          REMOTE_DEV_STATE_PATH: ${{ steps.native.outputs.state-path }}
        with:
          retries: 0
          script: |
            const { pathToFileURL } = require('node:url');
            const { finish } = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/provider/.build/main.js').href);
            await finish({ github, statePath: process.env.REMOTE_DEV_STATE_PATH });

  recover:
    needs: [resolve, execute]
    if: always() && !cancelled() && needs.resolve.result == 'success' && needs.execute.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          repository: markhuangai/agent-remote-dev
          ref: ${{ needs.resolve.outputs.provider_sha }}
          path: provider
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install locked recovery dependencies
        working-directory: provider
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Continue interrupted session
        uses: actions/github-script@v9
        with:
          retries: 0
          script: |
            const { pathToFileURL } = require('node:url');
            const { workflowCommand } = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/provider/src/platform/control.mjs').href);
            await workflowCommand('recover', { github, core });
