name: Test published remote development workflow
run-name: ${{ format('Test published remote development ({0})', inputs.channel) }}

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Agent runner
        type: choice
        options: [codex, claude]
        default: codex
      channel:
        description: Published workflow channel to test
        type: choice
        options: [stable, prerelease]
        default: stable
      plan:
        description: Refined plan or new context for a resumed conversation
        type: string
      resume-run-id:
        description: Prior run containing the conversation
        type: string
      runs-on:
        description: JSON array of Linux runner labels
        type: string
        default: '["ubuntu-latest"]'
      timeout-minutes:
        description: GitHub job timeout in minutes
        type: number
        default: 360

permissions:
  contents: read
  actions: write

jobs:
  stable:
    if: inputs.channel == 'stable'
    uses: markhuangai/agent-remote-dev/.github/workflows/remote-dev.yml@v1
    with:
      runner: ${{ inputs.runner }}
      plan: ${{ inputs.plan }}
      resume-run-id: ${{ inputs.resume-run-id }}
      runs-on: ${{ inputs.runs-on }}
      timeout-minutes: ${{ fromJSON(inputs.timeout-minutes) }}
    secrets:
      codex-config: ${{ secrets.CODEX_CONFIG_TOML }}
      codex-api-key: ${{ secrets.CODEX_API_KEY }}
      claude-settings: ${{ secrets.CLAUDE_SETTINGS_JSON }}
      claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      mcp-config: ${{ secrets.MCP_CONFIG_JSON }}
      github-token: ${{ secrets.REMOTE_DEV_PAT }}

  prerelease:
    if: inputs.channel == 'prerelease'
    uses: markhuangai/agent-remote-dev/.github/workflows/remote-dev.yml@v1-prerelease
    with:
      runner: ${{ inputs.runner }}
      plan: ${{ inputs.plan }}
      resume-run-id: ${{ inputs.resume-run-id }}
      runs-on: ${{ inputs.runs-on }}
      timeout-minutes: ${{ fromJSON(inputs.timeout-minutes) }}
    secrets:
      codex-config: ${{ secrets.CODEX_CONFIG_TOML }}
      codex-api-key: ${{ secrets.CODEX_API_KEY }}
      claude-settings: ${{ secrets.CLAUDE_SETTINGS_JSON }}
      claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      mcp-config: ${{ secrets.MCP_CONFIG_JSON }}
      github-token: ${{ secrets.REMOTE_DEV_PAT }}
