name: Remote development task runner
run-name: ${{ inputs.resume-run-id && format('Agent resume {0}', inputs.resume-run-id) || 'Agent task' }}

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Agent runner
        type: choice
        options: [codex, claude]
        default: codex
      plan:
        description: Refined plan or new context for a resumed conversation
        type: string
      resume-run-id:
        description: Prior run containing the conversation
        type: string

permissions:
  contents: read
  actions: write

jobs:
  run:
    uses: ./.github/workflows/remote-dev.yml
    with:
      runner: ${{ inputs.runner }}
      plan: ${{ inputs.plan }}
      resume-run-id: ${{ inputs.resume-run-id }}
      runs-on: '["ubuntu-latest"]'
      timeout-minutes: 360
    secrets:
      codex-config: ${{ secrets.CODEX_CONFIG_TOML }}
      codex-api-key: ${{ secrets.CODEX_API_KEY }}
      claude-settings: ${{ secrets.CLAUDE_SETTINGS_JSON }}
      claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      mcp-config: ${{ secrets.MCP_CONFIG_JSON }}
      github-token: ${{ secrets.REMOTE_DEV_PAT }}
