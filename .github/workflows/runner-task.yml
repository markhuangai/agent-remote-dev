name: Codex task runner
run-name: ${{ inputs.resume-run-id && format('Codex resume {0}', inputs.resume-run-id) || 'Codex task' }}

on:
  workflow_dispatch:
    inputs:
      plan:
        description: Refined plan or new context for a resumed conversation
        type: string
      resume-run-id:
        description: Prior run containing the conversation
        type: string

permissions:
  contents: read
  actions: write

jobs:
  run:
    uses: ./.github/workflows/remote-codex.yml
    with:
      plan: ${{ inputs.plan }}
      resume-run-id: ${{ inputs.resume-run-id }}
      runs-on: '["ubuntu-latest"]'
      timeout-minutes: 360
    secrets:
      codex-config: ${{ secrets.CODEX_CONFIG_TOML }}
      codex-api-key: ${{ secrets.CODEX_API_KEY }}
      github-token: ${{ secrets.REMOTE_DEV_PAT }}
