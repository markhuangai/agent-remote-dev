name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

jobs:
  validation:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Verify source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf 'Validated source: %s\n' "$SOURCE_SHA"
      - name: Install verified actionlint
        run: |
          set -euo pipefail
          task_tools="$RUNNER_TEMP/actionlint"
          mkdir "$task_tools"
          curl --fail --silent --show-error --location --max-time 120 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$task_tools/actionlint.tar.gz"
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$task_tools/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$task_tools/actionlint.tar.gz" -C "$task_tools" actionlint
          printf '%s\n' "$task_tools" >> "$GITHUB_PATH"
      - name: Lint workflows
        run: actionlint
      - name: Test review and validation policy
        run: node --test tests/review-policy.test.mjs
      - name: Install locked runtime and build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check runtime and bundled distribution
        run: |
          npm run check
          npm run test:skill-install

  runtime-arm64:
    name: Runtime (linux-arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Verify source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install locked runtime and build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check native arm64 runtime and bundle
        run: |
          npm run check
          npm run test:skill-install
