name: Linux runner acceptance

on:
  workflow_dispatch:
    inputs:
      source-sha:
        description: Exact merged source SHA explicitly authorized for live qualification
        required: true
        type: string
      action-ref:
        description: Optional v1-prerelease or v1 channel for an actual published workflow fresh/resume pair per runner family
        type: string
      self-hosted-labels:
        description: JSON labels for the provisioned self-hosted Linux runner
        required: true
        default: '["self-hosted","Linux"]'
        type: string
      authorization:
        description: Direct request authorizing smoke task branches, draft PRs, resumes, cancellation and scoped cleanup
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  TRIGGERING_ACTOR: ${{ github.triggering_actor }}
  SOURCE_SHA: ${{ inputs.source-sha }}
  ACTION_REF: ${{ inputs.action-ref }}

jobs:
  authorize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      targets: ${{ steps.prepare.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install locked helper dependencies
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - id: prepare
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          SELF_HOSTED_LABELS: ${{ inputs.self-hosted-labels }}
          QUALIFICATION_AUTHORIZATION: ${{ inputs.authorization }}
        with:
          retries: 0
          script: |
            const { pathToFileURL } = require('node:url');
            const { prepareQualification } = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/.github/scripts/qualification.mjs').href);
            const prepared = await prepareQualification({ github, context, core });
            core.setOutput('targets', JSON.stringify(prepared.targets));
            core.setOutput('path', prepared.path);
      - name: Persist task ownership before any live dispatch
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-qualification-${{ github.run_id }}-registry
          path: ${{ steps.prepare.outputs.path }}
          if-no-files-found: error
          overwrite: false

  qualify:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.authorize.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install locked helper dependencies
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: linux-qualification-${{ github.run_id }}-registry
          path: ${{ runner.temp }}/qualification-registry
      - name: Exercise real native tasks on the selected runner family
        env:
          GH_TOKEN: ${{ secrets.REMOTE_DEV_PAT }}
          QUALIFICATION_REGISTRY: ${{ runner.temp }}/qualification-registry/record.json
          QUALIFICATION_TARGET: ${{ matrix.target.key }}
          QUALIFICATION_OUTPUT: ${{ runner.temp }}/record.json
        run: node .github/scripts/qualification.mjs run
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-qualification-${{ github.run_id }}-${{ matrix.target.key }}
          path: ${{ runner.temp }}/record.json
          if-no-files-found: error
          overwrite: false

  cleanup:
    needs: [authorize, qualify]
    if: always() && needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install locked helper dependencies
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: linux-qualification-${{ github.run_id }}-registry
          path: ${{ runner.temp }}/qualification-registry
      - name: Stop owned tasks and remove only proven smoke resources
        env:
          GH_TOKEN: ${{ secrets.REMOTE_DEV_PAT }}
          QUALIFICATION_REGISTRY: ${{ runner.temp }}/qualification-registry/record.json
          QUALIFICATION_OUTPUT: ${{ runner.temp }}/record.json
        run: node .github/scripts/qualification.mjs cleanup
      - name: Preserve cleanup proof
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-qualification-${{ github.run_id }}-cleanup
          path: ${{ runner.temp }}/record.json
          if-no-files-found: error
          overwrite: false
