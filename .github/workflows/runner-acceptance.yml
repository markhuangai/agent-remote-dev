name: Linux runner acceptance

on:
  workflow_dispatch:
    inputs:
      source-sha:
        description: Exact authorized action implementation SHA
        required: true
        type: string
      plan:
        description: Inline approved plan, mutually exclusive with issue-url
        type: string
      issue-url:
        description: Approved issue URL in this repository, mutually exclusive with plan
        type: string
      authorization:
        description: JSON binding the direct YOLO delivery request to repository and plan hash
        required: true
        type: string
      git-author-name:
        description: Authorized job Git author and committer name
        required: true
        type: string
      git-author-email:
        description: Authorized job Git author and committer email
        required: true
        type: string

permissions:
  contents: read
  issues: read

jobs:
  acceptance:
    if: github.ref == 'refs/heads/main' && github.actor == 'Z-M-Huang' && github.triggering_actor == 'Z-M-Huang'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Verify authorized immutable source and plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
          INLINE_PLAN: ${{ inputs.plan }}
          ISSUE_URL: ${{ inputs.issue-url }}
          DELIVERY_AUTHORIZATION: ${{ inputs.authorization }}
        with:
          script: |
            const { createHash } = require('node:crypto');
            const sha = process.env.SOURCE_SHA;
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Exact source SHA required');
            const { data: source } = await github.rest.repos.getCommit({ ...context.repo, ref: sha });
            if (source.sha !== sha) throw new Error('Source identity mismatch');
            const repository = context.repo.owner + '/' + context.repo.repo;
            const inline = process.env.INLINE_PLAN || '';
            const issueUrl = process.env.ISSUE_URL || '';
            if (Boolean(inline.trim()) === Boolean(issueUrl.trim())) throw new Error('Exactly one plan source required');
            let plan = inline;
            if (issueUrl.trim()) {
              const prefix = 'https://github.com/' + repository + '/issues/';
              const number = issueUrl.slice(prefix.length);
              if (!issueUrl.startsWith(prefix) || !/^[1-9][0-9]*$/.test(number)) throw new Error('Invalid issue URL');
              const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: Number(number) });
              if (issue.pull_request || issue.state !== 'open' || !issue.body) throw new Error('Issue is not an open plan');
              plan = issue.body;
            }
            let authorization;
            try { authorization = JSON.parse(process.env.DELIVERY_AUTHORIZATION); }
            catch { throw new Error('Invalid authorization JSON'); }
            const hash = createHash('sha256').update(plan).digest('hex');
            if (!authorization || typeof authorization !== 'object' || Array.isArray(authorization) ||
                Object.keys(authorization).sort().join() !== 'plan_sha256,repository,request' ||
                authorization.repository !== repository || authorization.plan_sha256 !== hash ||
                typeof authorization.request !== 'string' || !authorization.request.trim()) {
              throw new Error('Authorization must bind this plan and repository without a mode selector');
            }
            core.info(JSON.stringify({ event: 'runtime.acceptance', source_sha: sha, plan_sha256: hash,
              actor: context.actor, workflow_sha: process.env.GITHUB_WORKFLOW_SHA, outcome: 'authorized' }));
      - name: Checkout verified action implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source-sha }}
          path: action-source
          persist-credentials: false
      - name: Checkout target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: target
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Execute explicitly authorized acceptance task
        uses: ./action-source
        with:
          working-directory: target
          plan: ${{ inputs.plan }}
          issue-url: ${{ inputs.issue-url }}
          authorization: ${{ inputs.authorization }}
          git-author-name: ${{ inputs.git-author-name }}
          git-author-email: ${{ inputs.git-author-email }}
          codex-config: ${{ secrets.CODEX_CONFIG_TOML }}
          codex-api-key: ${{ secrets.CODEX_API_KEY }}
          github-token: ${{ secrets.REMOTE_DEV_PAT }}
