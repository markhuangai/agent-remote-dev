name: Codex task runner
run-name: ${{ github.event_name == 'workflow_run' && format('Codex continuation / {0}', github.event.workflow_run.id) || (inputs.request && (fromJSON(inputs.request).operation == 'stop' && format('Codex stop {0} / {1}', fromJSON(inputs.request).task_id, fromJSON(inputs.request).stop_key) || (fromJSON(inputs.request).resume_artifact_id && format('Codex task {0} / {1}', fromJSON(inputs.request).task_id, fromJSON(inputs.request).dispatch_key || format('manual-resume-{0}-{1}-{2}', fromJSON(inputs.request).resume_artifact_id, fromJSON(inputs.request).source_sha, fromJSON(inputs.request).registration_key))) || format('Codex request {0} / request-{1}', fromJSON(inputs.request).request_id, fromJSON(inputs.request).registration_key))) || format('Codex run {0}', github.run_id) }}

on:
  workflow_dispatch:
    inputs:
      plan:
        description: Prompt for Codex, including any issue references
        type: string
      request:
        description: Internal request used by the optional local client and continuation
        type: string
  workflow_run:
    workflows: [Codex task runner]
    types: [completed]

permissions:
  contents: read
  actions: write

jobs:
  remote:
    uses: markhuangai/agent-remote-dev-codex/.github/workflows/remote-codex.yml@v1
    with:
      plan: ${{ inputs.plan }}
      request: ${{ inputs.request }}
    secrets:
      codex-config: ${{ secrets.CODEX_CONFIG_TOML }}
      codex-api-key: ${{ secrets.CODEX_API_KEY }}
      github-token: ${{ secrets.REMOTE_DEV_PAT }}
